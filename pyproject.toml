[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "eelang"
version = "0.3.0"
description = "Gleam-like language for the BEAM with Python syntax"
readme = "README.md"
requires-python = ">=3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "pwtail", email = "abvit89s@gmail.com" }]
keywords = ["beam", "erlang", "gleam", "compiler", "language"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Compilers",
]

[project.urls]
Repository = "https://github.com/eel-lang/eelang"

[project.scripts]
eel = "eel.__main__:main"

[project.optional-dependencies]
dev = ["pytest"]
notebook = ["ipykernel"]

[tool.setuptools]
packages = ["eel"]

[tool.setuptools.package-data]
eel = ["*.escript"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
